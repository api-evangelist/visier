notes: >-
  Visier's public API surface has two distinct object layers that should not be conflated. The
  ANALYTIC MODEL layer is metadata about the tenant's people data — analytic objects, their
  properties, the metrics computed over them, and the dimensions/members used to slice them. The
  PLATFORM layer is the tenant's own administration objects — tenants, users, profiles, permissions,
  projects, data versions, jobs, webhooks. The entity graph below is derived from the URI hierarchy
  and schema $ref structure of the published OpenAPI, which is where Visier makes containment
  explicit (e.g. /v1/data/model/analytic-objects/{objectId}/dimensions/{dimensionId}/members).

