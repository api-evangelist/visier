aid: visier
name: Visier
description: 'Visier is a workforce and people analytics platform that consolidates HR, talent,
  compensation, and operational data into a purpose-built people data model, then exposes that model
  for analysis, planning, and AI-assisted question answering. Visier publishes a broad suite of public
  REST APIs — Data In (Direct Data Intake, Data Upload, job handling), Data Out (Data Query, Vee,
  exports), Administration (tenants, users, profiles, permissions, projects), Analytic Model (data
  model, concepts, metrics, dimensions), Planning, Webhooks, and dataset APIs such as Compensation
  Benchmarks and the Skills Intelligence Engine. OpenAPI v3 definitions for every collection are
  published on GitHub at visier/openapi-clients, generated Python SDKs ship to PyPI, and a hosted
  Visier Query MCP server exposes Vee and data-query tools to MCP clients over OAuth 2.0.'
image: https://www.visier.com/static/visier-og-image-289b36a6392a307b7342ffcf69bdee4c.jpg
