- aid: visier:visier-analyticobjectsv2-api
  name: Visier Analytic Objects V2 API
  description: >-
    Create, retrieve, update, and delete analytic objects in your analytic model. You can create, update,
    and delete one or more analytic objects in an API call.

    The supported analytic objects are <em>subjects</em> (entities that evolve over time) and <em>events</em>
    (things that happen to subjects at specific points in time).

    <br>**Note:** <em>This API is in **alpha**. While in alpha, APIs may change in a breaking way without
    notice; functionality may be removed, and no deprecation notices will be issued.

    If you are interested in using this API, please contact your Customer Success Manager (CSM).</em>
